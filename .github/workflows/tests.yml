name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: docker build --tag signalharbor-dependencies .
      - name: Verify checkout in the offline dependency environment
        run: >-
          docker run --rm --network none
          --mount "type=bind,source=${{ github.workspace }},target=/app,readonly"
          --env CARGO_TARGET_DIR=/validation-target --env CARGO_BUILD_JOBS=1
          --env CARGO_PROFILE_TEST_DEBUG=0 --env CARGO_PROFILE_DEV_DEBUG=0
          --env CARGO_INCREMENTAL=0
          --workdir /app signalharbor-dependencies cargo test --locked --offline
